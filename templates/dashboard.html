<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script>
      (function () {
        function setDashScale() {
          try {
            const html = document.documentElement;
            const width = window.innerWidth || document.documentElement.clientWidth || 0;
            const height = window.innerHeight || document.documentElement.clientHeight || 0;

            const designW = parseFloat(getComputedStyle(html).getPropertyValue("--dash-design-w")) || 960;
            const designH = parseFloat(getComputedStyle(html).getPropertyValue("--dash-design-h")) || 540;

            const sx = Math.max(0, width / designW);
            const sy = Math.max(0, height / designH);
            const uniformScale = Math.min(sx, sy);

            html.style.setProperty("--dash-sx", (Math.round(sx * 10000) / 10000).toString());
            html.style.setProperty("--dash-sy", (Math.round(sy * 10000) / 10000).toString());
            html.style.setProperty("--dash-scale", (Math.round(uniformScale * 10000) / 10000).toString());
          } catch (e) {
            document.documentElement.style.setProperty("--dash-sx", "1");
            document.documentElement.style.setProperty("--dash-sy", "1");
            document.documentElement.style.setProperty("--dash-scale", "1");
          }
        }

        window.addEventListener("resize", setDashScale, { passive: true });
        window.addEventListener("DOMContentLoaded", setDashScale);
        setDashScale();
      })();
    </script>

    <style>
      __DASHBOARD_CSS__
    </style>
  </head>

  <body>
    <div class="dashboard-viewport">
      <div class="cronogramas-layout">
        <div class="filter-strip" id="filter-strip"></div>

        <section class="dash-card slot-top-left" data-slot="top_left"><div class="dash-card-inner"></div></section>
        <section class="dash-card slot-top-right" data-slot="top_right"><div class="dash-card-inner"></div></section>
        <section class="dash-card slot-left-middle" data-slot="left_middle"><div class="dash-card-inner"></div></section>
        <section class="dash-card slot-center" data-slot="center"><div class="dash-card-inner"></div></section>
        <section class="dash-card slot-left-bottom" data-slot="left_bottom"><div class="dash-card-inner"></div></section>
        <section class="dash-card slot-right-bottom" data-slot="right_bottom"><div class="dash-card-inner"></div></section>
      </div>
    </div>

    <script id="payload-data" type="application/json">__PAYLOAD_JSON__</script>
    <script>
      (function () {
        const SLOT_ORDER = ["top_left", "top_right", "left_middle", "center", "left_bottom", "right_bottom"];
        const SLOT_ALIASES = {
          top_left: "top_left",
          top_left_card: "top_left",
          topleft: "top_left",
          left_top: "top_left",
          principal: "top_left",
          resumo: "top_left",
          overview: "top_left",
          main: "top_left",
          card_1: "top_left",

          top_right: "top_right",
          top_right_card: "top_right",
          topright: "top_right",
          right_top: "top_right",
          lateral_top: "top_right",
          card_2: "top_right",

          left_middle: "left_middle",
          left_mid: "left_middle",
          middle_left: "left_middle",
          mid_left: "left_middle",
          small_left_top: "left_middle",
          card_3: "left_middle",

          center: "center",
          middle: "center",
          centro: "center",
          cronograma: "center",
          timeline: "center",
          principal_vertical: "center",
          card_4: "center",

          left_bottom: "left_bottom",
          bottom_left: "left_bottom",
          leftbottom: "left_bottom",
          small_left_bottom: "left_bottom",
          card_5: "left_bottom",

          right_bottom: "right_bottom",
          bottom_right: "right_bottom",
          rightbottom: "right_bottom",
          lateral_bottom: "right_bottom",
          card_6: "right_bottom"
        };

        function safeArray(value) {
          if (Array.isArray(value)) return value;
          if (value === undefined || value === null || value === "") return [];
          return [value];
        }

        function normalizeKey(value) {
          return String(value || "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "_")
            .replace(/^_+|_+$/g, "");
        }

        function pickFirst(source, keys) {
          if (!source || typeof source !== "object") return "";
          for (const key of keys) {
            const value = source[key];
            if (value !== undefined && value !== null && String(value).trim() !== "") {
              return value;
            }
          }
          return "";
        }

        function escapeHtml(value) {
          return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }

        function resolveSlot(rawSlot, fallbackSlot) {
          const normalized = normalizeKey(rawSlot);
          return SLOT_ALIASES[normalized] || fallbackSlot;
        }

        function normalizeItem(item) {
          if (item === null || item === undefined) {
            return {
              primary: "",
              secondary: "",
              value: "",
              status: "",
              date: "",
              consultor: "",
              time: "",
              cliente: ""
            };
          }

          if (typeof item !== "object") {
            return {
              primary: String(item),
              secondary: "",
              value: "",
              status: "",
              date: "",
              consultor: "",
              time: "",
              cliente: ""
            };
          }

          const primary = pickFirst(item, [
            "primary", "titulo", "title", "nome", "name", "indicador", "label",
            "atividade", "tarefa", "task", "texto", "text"
          ]);
          const secondary = pickFirst(item, [
            "secondary", "subtitulo", "subtitle", "descricao", "description",
            "detalhe", "detalhes", "observacao", "observacoes", "obs"
          ]);
          const value = pickFirst(item, ["formattedValue", "valorFormatado", "value", "valor"]);
          const status = pickFirst(item, ["status", "situacao", "state"]);
          const date = pickFirst(item, ["prazo", "date", "data", "inicio", "fim", "deadline"]);
          const consultor = pickFirst(item, ["consultor", "responsavel", "owner"]);
          const time = pickFirst(item, ["time", "team", "equipe"]);
          const cliente = pickFirst(item, ["cliente", "customer", "conta"]);

          return {
            primary: String(primary || "").trim(),
            secondary: String(secondary || "").trim(),
            value: String(value || "").trim(),
            status: String(status || "").trim(),
            date: String(date || "").trim(),
            consultor: String(consultor || "").trim(),
            time: String(time || "").trim(),
            cliente: String(cliente || "").trim()
          };
        }

        function normalizeCard(rawCard, fallbackTitle) {
          const card = rawCard && typeof rawCard === "object" ? rawCard : {};
          const title = pickFirst(card, ["titulo", "title", "nome", "name"]).toString().trim() || "";
          const subtitle = pickFirst(card, ["subtitulo", "subtitle", "descricao", "description"]).toString().trim() || "";
          const itemsSource = card.itens ?? card.items ?? card.linhas ?? card.rows ?? [];
          const items = safeArray(itemsSource).map(normalizeItem).filter(Boolean);

          return {
            title,
            subtitle,
            emptyMessage: pickFirst(card, ["mensagemVazia", "emptyMessage"]).toString().trim(),
            items,
            fallbackTitle: fallbackTitle || ""
          };
        }

        function parsePayload() {
          const node = document.getElementById("payload-data");
          if (!node) return {};
          try {
            return JSON.parse(node.textContent || "{}");
          } catch (error) {
            return {};
          }
        }

        function normalizeDashboard(payload) {
          const sourceCards = payload && payload.cards ? payload.cards : {};
          const entries = Array.isArray(sourceCards)
            ? sourceCards.map((card, index) => [String(index), card])
            : Object.entries(sourceCards || {});

          const cards = Object.fromEntries(
            SLOT_ORDER.map((slot) => [slot, normalizeCard({}, "")])
          );

          entries.slice(0, 6).forEach(([key, card], index) => {
            const slot = resolveSlot(
              pickFirst(card || {}, ["slot", "position", "layoutSlot", "cardSlot"]) || key,
              SLOT_ORDER[index] || SLOT_ORDER[0]
            );
            cards[slot] = normalizeCard(card, key);
          });

          return {
            title: payload?.spreadsheetName || payload?.title || "Dashboard de Cronogramas",
            updatedAt: payload?.updatedAt || "",
            cards,
            filters: payload?.filters || {}
          };
        }

        function deriveFilterOptions(dashboard) {
          const allItems = SLOT_ORDER.flatMap((slot) => dashboard.cards[slot]?.items || []);

          const buildOptions = (key, payloadKey) => {
            const payloadOptions = safeArray(dashboard.filters?.[payloadKey]).map((value) => String(value).trim()).filter(Boolean);
            if (payloadOptions.length) {
              return payloadOptions;
            }
            return Array.from(
              new Set(
                allItems
                  .map((item) => String(item[key] || "").trim())
                  .filter(Boolean)
              )
            ).sort((a, b) => a.localeCompare(b, "pt-BR"));
          };

          return {
            consultor: buildOptions("consultor", "consultor"),
            time: buildOptions("time", "time"),
            cliente: buildOptions("cliente", "cliente")
          };
        }

        const dashboard = normalizeDashboard(parsePayload());
        const filterOptions = deriveFilterOptions(dashboard);
        const currentFilters = { consultor: "Todos", time: "Todos", cliente: "Todos" };

        function matchesFilter(value, selected) {
          if (!selected || selected === "Todos") return true;
          if (!value) return true;
          return String(value).trim() === selected;
        }

        function renderFilters() {
          const target = document.getElementById("filter-strip");
          if (!target) return;

          const fields = [
            { key: "consultor", label: "Consultor:" },
            { key: "time", label: "Time:" },
            { key: "cliente", label: "Cliente:" }
          ];

          target.innerHTML = fields.map((field) => {
            const options = ["Todos", ...(filterOptions[field.key] || [])]
              .map((option) => `<option value="${escapeHtml(option)}">${escapeHtml(option)}</option>`)
              .join("");

            return `
              <label class="filter-field">
                <span class="filter-label">${escapeHtml(field.label)}</span>
                <select class="filter-select" data-filter="${escapeHtml(field.key)}">
                  ${options}
                </select>
              </label>
            `;
          }).join("");

          target.querySelectorAll("select[data-filter]").forEach((select) => {
            select.addEventListener("change", (event) => {
              const key = event.currentTarget.getAttribute("data-filter");
              currentFilters[key] = event.currentTarget.value || "Todos";
              renderCards();
            });
          });
        }

        function buildItemMeta(item) {
          return [item.consultor, item.time, item.cliente].filter(Boolean);
        }

        function buildItemChips(item) {
          return [item.value, item.status, item.date].filter(Boolean);
        }

        function renderCard(slot) {
          const card = dashboard.cards[slot] || normalizeCard({}, "");
          const target = document.querySelector(`[data-slot="${slot}"] .dash-card-inner`);
          if (!target) return;

          const visibleItems = (card.items || []).filter((item) => (
            matchesFilter(item.consultor, currentFilters.consultor)
            && matchesFilter(item.time, currentFilters.time)
            && matchesFilter(item.cliente, currentFilters.cliente)
          ));

          const showHeader = Boolean(card.title || card.subtitle);
          const headerHtml = showHeader ? `
            <div class="card-header">
              ${card.title ? `<div class="card-title">${escapeHtml(card.title)}</div>` : ""}
              ${card.subtitle ? `<div class="card-subtitle">${escapeHtml(card.subtitle)}</div>` : ""}
            </div>
          ` : "";

          const itemsHtml = visibleItems.map((item) => {
            const meta = buildItemMeta(item);
            const chips = buildItemChips(item);
            const primary = item.primary || item.secondary || item.cliente || item.consultor || item.time || "";
            const secondary = primary === item.secondary ? "" : item.secondary;

            return `
              <article class="card-item">
                <div class="card-item-copy">
                  ${primary ? `<div class="card-item-title">${escapeHtml(primary)}</div>` : ""}
                  ${secondary ? `<div class="card-item-secondary">${escapeHtml(secondary)}</div>` : ""}
                  ${meta.length ? `<div class="card-item-meta">${meta.map((value) => `<span class="meta-chip">${escapeHtml(value)}</span>`).join("")}</div>` : ""}
                </div>
                ${chips.length ? `<div class="card-item-side">${chips.map((value) => `<span class="value-chip">${escapeHtml(value)}</span>`).join("")}</div>` : ""}
              </article>
            `;
          }).join("");

          const emptyHtml = (!visibleItems.length && (card.emptyMessage || showHeader))
            ? `<div class="card-empty">${escapeHtml(card.emptyMessage || "Sem itens para o filtro selecionado.")}</div>`
            : "";

          target.innerHTML = `
            <div class="card-content ${visibleItems.length ? "has-items" : "is-empty"}">
              ${headerHtml}
              <div class="card-body">
                ${itemsHtml}
                ${emptyHtml}
              </div>
            </div>
          `;
        }

        function renderCards() {
          SLOT_ORDER.forEach(renderCard);
        }

        renderFilters();
        renderCards();
      })();
    </script>
  </body>
</html>
